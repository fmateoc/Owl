# NY School Tax Relief (STAR) credit data for Owl retirement planner (fork).
#
# The STAR credit (Tax Law sec. 606(eee)) is a refundable New York personal income tax credit,
# paid in advance as a check or direct deposit around the time school taxes are due. It goes to
# a NY resident who owns and lives in the home on July 1 of the year; homes that have had the STAR
# exemption since 2015 keep the exemption instead (not modeled: the credit is what any purchase
# gets). Amounts are set per municipality and school district ("portion"), and the credit cannot
# exceed the school taxes paid (sec. 606(eee)(3)(B), (4)(B)).
#
# [NY] fields:
#   description          = free text: what the numbers are and where they come from
#   amounts_year         = benefit year of the district amounts below
#   credit_growth_pct    = nominal growth of the amounts per year after amounts_year. RPTL sec.
#                          1306-a(2)(a)(i)(B) caps the credit at 102% of the prior year's; the
#                          actual growth can be lower (tax.ny.gov: "can increase by as much as 2%").
#   basic_income_limit   = Basic STAR credit: affiliated income at most this (sec. 606(eee)(3)(A)),
#                          a fixed amount
#   enhanced_age         = Enhanced STAR: one owner at least this old on December 31 (sec. 606(eee)(4))
#   surviving_spouse_age = a surviving spouse at least this old keeps an Enhanced credit already allowed
#   enhanced_limit_years / enhanced_limit_amounts = Enhanced income standard per benefit year; later
#                          years grow with the Social Security cost-of-living adjustment and never
#                          decrease (RPTL sec. 425(4)(b)(i)(C)-(D)); Owl indexes them with inflation
#   income_lag_years     = income is that of the tax year this many years before the benefit year
#                          (tax.ny.gov: 2026 benefits use 2024 returns)
#
# Income ("affiliated income", sec. 606(eee)(1)(B)): federal AGI of the owners living there and
# their spouses, less IRA distributions included in AGI (1040 line 11 minus line 4b).
#
# [[NY.districts]]: one row per municipality and school district. basic / enhanced = the final
# STAR credit for amounts_year, from tax.ny.gov "STAR credit and exemption savings amounts"
# (https://www.tax.ny.gov/pit/property/star/comparison/), county pages read 2026-10-17. Rows in
# two tax classes (Homestead / Non-Homestead) keep the Homestead row, which applies to homes. New
# York City rows are per property tax class (1: one- to three-family homes, 2: co-ops and condos).
# Only Westchester County and New York City are here; to add a county, copy its page's rows.

[NY]
description = "STAR credit (Tax Law sec. 606(eee); RPTL secs. 425 and 1306-a, read on nysenate.gov 2026-10-17). Income limits from tax.ny.gov STAR eligibility (updated 2026-06-03): Basic credit $500,000; Enhanced $110,750 for 2026 benefits and $113,550 for 2027. District amounts: 2025 final credits from tax.ny.gov, Westchester and New York City pages, read 2026-10-17."
amounts_year = 2025
credit_growth_pct = 2.0
basic_income_limit = 500000.0
enhanced_age = 65
surviving_spouse_age = 62
enhanced_limit_years = [2026, 2027]
enhanced_limit_amounts = [110750.0, 113550.0]
income_lag_years = 2

